<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body><header class="site-header"><div class="container nav">
<a class="logo" href="../">Aprova<span>Quest</span></a>
<nav class="nav-links" aria-label="Navegação"><a href="../questoes/">Questões</a><a href="../simulados/">Simulados</a><a href="../sobre/">Sobre</a><a href="../contato/">Contato</a></nav>

<main><div class="container"><div class="sim-card">
<h1>Simulados</h1><p class="muted">Escolha os filtros e pratique com uma sequência aleatória de questões.</p>
<section id="sim-setup" class="card"><div class="form-grid">
<div><label for="sim-materia">Matéria</label><select id="sim-materia"><option value="">Todas</option><option>Matemática</option><option>Física</option><option>Química</option><option>Biologia</option></select></div>
<div><label for="sim-dificuldade">Dificuldade</label><select id="sim-dificuldade"><option value="">Todas</option><option>Fácil</option><option>Médio</option><option>Difícil</option></select></div>
<div><label for="sim-qtd">Questões</label><select id="sim-qtd"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div></div><div class="actions"><button class="btn" id="start-sim">COMEÇAR</button></div></section>
<section id="sim-quiz" hidden></section><section id="sim-result" hidden></section>
</div></div></main><footer class="footer"><div class="container footer-inner"><div>© <span data-year></span> AprovaQuest</div><div><a href="../politica-de-privacidade/">Política de Privacidade</a> · <a href="../sobre/">Sobre</a> · <a href="../contato/">Contato</a></div></div></footer><script type="module" src="../js/simulados.js"></script></body></html>
