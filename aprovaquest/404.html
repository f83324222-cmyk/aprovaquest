<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AprovaQuest</title>
<meta name="description" content="Conteúdo educacional do AprovaQuest."><style>body{font-family:system-ui,sans-serif;max-width:850px;margin:40px auto;padding:20px;line-height:1.6;color:#172033}a{color:#315efb}</style></head>
<body><main id="route"><h1>Carregando…</h1></main>
<script>
(function(){
 const parts=location.pathname.split("/").filter(Boolean);
 const idx=parts.lastIndexOf("questao");
 const base=idx>=0 ? location.pathname.split("/").slice(0,idx).join("/")+"/" : location.pathname.split("/").slice(0,-2).join("/")+"/";
 const slug=idx>=0 ? parts[idx+1] : "";
 if(idx>=0 && slug){
   location.replace(base+"questao/?slug="+encodeURIComponent(slug));
 } else {
   document.querySelector("#route").innerHTML='<h1>Página não encontrada</h1><p>O endereço não existe.</p><a href="'+base+'">Voltar ao início</a>';
 }
})();
</script></body></html>
