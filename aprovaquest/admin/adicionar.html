<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adicionar questão | AprovaQuest</title><link rel="stylesheet" href="../css/style.css"></head>
<body data-page="editor"><header class="site-header"><div class="container nav"><a class="logo" href="../">Aprova<span>Quest</span></a><nav class="nav-links"><a href="index.html">Painel</a><button class="btn small secondary" data-logout>Sair</button></nav></div></header>
<main><div class="container"><h1 id="page-title">Adicionar questão</h1><div id="admin-msg"></div><form id="question-form" class="card"><div class="form-grid">
<div><label>Matéria</label><input name="materia" required placeholder="Matemática"></div>
<div><label>Assunto</label><select id="assunto" name="assunto" required></select></div>
<div class="form-full"><label>Título</label><input name="titulo" required></div>
<div><label>Slug</label><input name="slug" placeholder="gerado a partir do título"></div>
<div><label>Dificuldade</label><select name="dificuldade"><option>Fácil</option><option>Médio</option><option>Difícil</option></select></div>
<div class="form-full"><label>Enunciado</label><textarea name="enunciado" required></textarea></div>
<div><label>Alternativa A</label><input name="alternativa_a" required></div><div><label>Alternativa B</label><input name="alternativa_b" required></div>
<div><label>Alternativa C</label><input name="alternativa_c" required></div><div><label>Alternativa D</label><input name="alternativa_d" required></div>
<div><label>Alternativa E</label><input name="alternativa_e" required></div><div><label>Resposta correta</label><select name="resposta_correta"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select></div>
<div class="form-full"><label>Explicação / resolução</label><textarea name="explicacao" required></textarea></div>
<div class="form-full"><label>Dica</label><textarea name="dica"></textarea></div>
</div><div class="actions"><button class="btn" type="submit">PUBLICAR QUESTÃO</button><a class="btn secondary" href="index.html">Cancelar</a></div></form></div></main><script type="module" src="js/admin.js"></script></body></html>
